  --bad:           #ff453a;
  --bad-soft:      rgba(255,69,58,.15);
  --warn:          #ffd60a;
  --radius:        14px;
  --radius-sm:     10px;
  --tap:           44px;
  --safe-t:        env(safe-area-inset-top, 0px);
  --safe-b:        env(safe-area-inset-bottom, 0px);
  --safe-l:        env(safe-area-inset-left, 0px);
  --safe-r:        env(safe-area-inset-right, 0px);
  --topbar-h:      52px;
  --tabbar-h:      54px;
  color-scheme: dark;
}

html[data-theme="light"], :root[data-theme="auto"] {
  /* перекрывается медиазапросом ниже; значения по умолчанию — тёмные */
}

@media (prefers-color-scheme: light) {
  html[data-theme="auto"] {
    --bg:          #f5f6f8;
    --bg-elev:     #ffffff;
    --bg-elev-2:   #eef0f4;
    --line:        #dfe3ea;
    --text:        #12151c;
    --text-dim:    #5b6373;
    --text-faint:  #8d95a5;
    --accent:      #0a63e6;
    --accent-soft: rgba(10,99,230,.10);
    --ok:          #1e9e4a;
    --ok-soft:     rgba(30,158,74,.12);
    --bad:         #d02b20;
    --bad-soft:    rgba(208,43,32,.12);
    color-scheme: light;
  }
}

html[data-theme="light"] {
  --bg:          #f5f6f8;
  --bg-elev:     #ffffff;
  --bg-elev-2:   #eef0f4;
  --line:        #dfe3ea;
  --text:        #12151c;
  --text-dim:    #5b6373;
  --text-faint:  #8d95a5;
  --accent:      #0a63e6;
  --accent-soft: rgba(10,99,230,.10);
  --ok:          #1e9e4a;
  --ok-soft:     rgba(30,158,74,.12);
  --bad:         #d02b20;
  --bad-soft:    rgba(208,43,32,.12);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

body { position: fixed; inset: 0; overflow: hidden; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: var(--accent); text-decoration: none; }

/* Отключает двойной тап-зум на интерактивных элементах и убирает задержку 300 мс
   без JS-перехвата touch-событий. */
button, a, label, select, input, .opt, .tab { touch-action: manipulation; }

/* ------------------------------ каркас ---------------------------------- */

.app {
  position: absolute; inset: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.app[hidden] { display: none; }

.topbar {
  display: flex; align-items: center; gap: 4px;
  padding: var(--safe-t) calc(8px + var(--safe-r)) 0 calc(8px + var(--safe-l));
  height: calc(var(--topbar-h) + var(--safe-t));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
  position: relative; z-index: 3;
}
.topbar__title {
  flex: 1; margin: 0; min-width: 0;
  font-size: 17px; font-weight: 600; letter-spacing: -.01em;
  text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar__slot { min-width: var(--tap); display: flex; justify-content: flex-end; align-items: center; }
.icon-btn {
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center; flex: none;
  color: var(--accent); border-radius: 50%;
}
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:active { background: var(--bg-elev-2); }

.screen {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 16px calc(16px + var(--safe-r)) 24px calc(16px + var(--safe-l));
  outline: none;
}

.tabbar {
  display: flex;
  padding-bottom: var(--safe-b);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
}
.tabbar[hidden] { display: none; }
.tab {
  flex: 1; height: var(--tabbar-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-faint); font-size: 10px; font-weight: 500;
}
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); }

/* ---------------------------- типовые блоки ----------------------------- */

.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.card--tight { padding: 12px 14px; }

.section-title {
  margin: 20px 0 8px;
  font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-faint);
}
.section-title:first-child { margin-top: 4px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 50px; padding: 12px 16px;
  border-radius: var(--radius);
  background: var(--accent); color: #fff;
  font-size: 16px; font-weight: 600;
  transition: transform .08s ease, opacity .15s ease;
  text-align: center;
}
.btn:active { transform: scale(.985); opacity: .9; }
.btn--secondary { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--line); }
.btn--ghost { background: transparent; color: var(--accent); min-height: var(--tap); }
.btn--danger { background: var(--bad-soft); color: var(--bad); }
.btn:disabled { opacity: .45; }
.btn + .btn { margin-top: 10px; }

.menu { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.menu__item {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 58px; padding: 10px 14px;
  text-align: left; color: var(--text);
  border-bottom: 1px solid var(--line);
}
.menu__item:last-child { border-bottom: 0; }
.menu__item:active { background: var(--bg-elev-2); }
.menu__icon {
  width: 34px; height: 34px; flex: none; border-radius: 9px;
  display: grid; place-items: center; font-size: 17px;
  background: var(--accent-soft); color: var(--accent);
}
/* Заголовок и подпись верстаются span'ами внутри <button>/<label>
   (вложенный блочный элемент в кнопке невалиден) — поэтому display задаём явно. */
.menu__body, .check__body { flex: 1; min-width: 0; display: block; }
.menu__title { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; }
.menu__sub { display: block; font-size: 13px; line-height: 1.3; color: var(--text-dim); margin-top: 2px; }
.menu__chev { color: var(--text-faint); font-size: 20px; line-height: 1; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.muted { color: var(--text-dim); }
.small { font-size: 13px; }
.tiny  { font-size: 12px; }
.center { text-align: center; }
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }

.pill {
  display: inline-block; padding: 3px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: var(--bg-elev-2); color: var(--text-dim);
}
.pill--ok  { background: var(--ok-soft);  color: var(--ok); }
.pill--bad { background: var(--bad-soft); color: var(--bad); }

.bar { height: 6px; border-radius: 3px; background: var(--bg-elev-2); overflow: hidden; }
.bar__fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .35s ease; }
.bar__fill--ok { background: var(--ok); }

/* ------------------------------ вопрос ---------------------------------- */

.quiz { display: flex; flex-direction: column; min-height: 100%; }

.quiz__meta {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: var(--text-dim); margin-bottom: 8px;
}
.quiz__progress { margin-bottom: 16px; }

.quiz__q {
  font-size: 17px; line-height: 1.4; font-weight: 500;
  margin: 0 0 16px;
  hyphens: auto; -webkit-hyphens: auto;
}

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start;
  width: 100%; padding: 13px 14px; text-align: left;
  background: var(--bg-elev);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  color: var(--text); font-size: 15px; line-height: 1.38;
  transition: background .15s ease, border-color .15s ease;
}
.opt:active { background: var(--bg-elev-2); }
.opt__n {
  flex: none; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--bg-elev-2); color: var(--text-dim);
  font-size: 13px; font-weight: 700;
}
.opt__t { flex: 1; min-width: 0; }
.opt[data-state="picked"]  { border-color: var(--accent); background: var(--accent-soft); }
.opt[data-state="picked"] .opt__n { background: var(--accent); color: #fff; }
.opt[data-state="right"]   { border-color: var(--ok); background: var(--ok-soft); }
.opt[data-state="right"] .opt__n { background: var(--ok); color: #fff; }
.opt[data-state="wrong"]   { border-color: var(--bad); background: var(--bad-soft); }
.opt[data-state="wrong"] .opt__n { background: var(--bad); color: #fff; }
.opt:disabled { opacity: 1; }

.verdict {
  margin-top: 14px; padding: 12px 14px; border-radius: var(--radius);
  font-size: 14px; font-weight: 600;
}
.verdict--ok  { background: var(--ok-soft);  color: var(--ok); }
.verdict--bad { background: var(--bad-soft); color: var(--bad); }

.quiz__foot { margin-top: auto; padding-top: 18px; }
/* После ответа панель прилипает к низу: вопросы бывают на два экрана,
   и искать «Далее» прокруткой — лишняя работа для пользователя. */
.quiz__foot--pinned {
  position: sticky; bottom: -24px; z-index: 2;
  padding-bottom: 24px;
  background: linear-gradient(to top, var(--bg) 72%, transparent);
}

.timer { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.timer--alarm { color: var(--bad); }

/* ------------------------------ результат -------------------------------- */

.result-hero { text-align: center; padding: 22px 0 10px; }
.result-hero__mark {
  width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 50%;
  display: grid; place-items: center; font-size: 40px;
}
.result-hero__mark--ok  { background: var(--ok-soft);  color: var(--ok); }
.result-hero__mark--bad { background: var(--bad-soft); color: var(--bad); }
.result-hero__title { font-size: 24px; font-weight: 700; margin: 0 0 6px; }
.result-hero__sub { color: var(--text-dim); font-size: 15px; margin: 0; }

.review { margin-top: 8px; }
.review__item { border-bottom: 1px solid var(--line); padding: 12px 0; }
.review__item:last-child { border-bottom: 0; }
.review__q { font-size: 14px; line-height: 1.35; margin-bottom: 6px; }
.review__a { font-size: 13px; line-height: 1.35; padding-left: 16px; position: relative; }
.review__a::before { content: '—'; position: absolute; left: 0; }
.review__a--ok  { color: var(--ok); }
.review__a--bad { color: var(--bad); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 50%, transparent); }

/* ------------------------------ прочее ---------------------------------- */

.check {
  display: flex; align-items: center; gap: 12px;
  min-height: 52px; padding: 8px 14px;
  border-bottom: 1px solid var(--line);
}
.check:last-child { border-bottom: 0; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }

.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
.switch__track {
  position: absolute; inset: 0; border-radius: 999px; background: var(--bg-elev-2);
  transition: background .2s ease; pointer-events: none;
}
.switch__track::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff; transition: transform .2s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .switch__track { background: var(--ok); }
.switch input:checked + .switch__track::after { transform: translateX(20px); }

.seg { display: flex; background: var(--bg-elev-2); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
.seg__btn {
  flex: 1; min-height: 36px; border-radius: 8px; font-size: 14px; font-weight: 600;
  color: var(--text-dim);
}
.seg__btn[aria-pressed="true"] { background: var(--bg-elev); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }

.empty { text-align: center; padding: 48px 20px; color: var(--text-dim); }
.empty__icon { font-size: 44px; margin-bottom: 12px; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px;
}
.stat__v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat__l { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

.hist { font-size: 13px; }
.hist__row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hist__row:last-child { border-bottom: 0; }

/* ------------------------------ служебное -------------------------------- */

.boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
.boot[hidden] { display: none; }
.boot__spinner {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid var(--line); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  max-width: 88%; padding: 11px 16px; border-radius: 999px;
  background: var(--bg-elev-2); border: 1px solid var(--line);
  color: var(--text); font-size: 14px; text-align: center;
  z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.35);
  animation: toast-in .2s ease;
}
.toast[hidden] { display: none; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>

[40,1,1,"Возраст, по достижении которого граждане Российской Федерации имеют право на приобретение охотничьего огнестрельного гладкоствольного длинноствольного оружия:","Может быть снижен не более чем на два года по решению законодательного (представительного) органа государственной власти субъекта Российской Федерации","Может быть снижен не более чем на один год по решению законодательного (представительного) органа государственной власти субъекта Российской Федерации","Не может быть снижен"],
[41,1,3,"В соответствии с Федеральным законом «Об оружии» огнестрельное оружие ограниченного поражения иностранного производства, его основные части, а также патроны травматического действия, изготовленные за пределами территории Российской Федерации:","Подлежат ввозу в Российскую Федерацию, если их технические характеристики соответствуют аналогичным моделям отечественного производства.","Подлежат ввозу в Российскую Федерацию.","Не подлежат ввозу в Российскую Федерацию."],
[42,1,2,"В случае изменения места жительства гражданин Российской Федерации обязан обратиться с заявлением о постановке на учет принадлежащего ему оружия:","В территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия по прежнему месту жительства в двухнедельный срок со дня регистрации.","В соответствующий территориальный орган федерального органа исполнительной власти, уполномоченного в сфере оборота оружия по новому месту жительства в двухнедельный срок со дня регистрации.","В территориальные органы федерального органа исполнительной власти, уполномоченного в сфере оборота оружия по прежнему, а также по новому месту жительства, в течении месяца со дня регистрации."],
[43,1,3,"Оружие, находящееся на законных основаниях на праве личной собственности у гражданина Российской Федерации может быть продано другому гражданину, имеющему лицензию на приобретение оружия, его коллекционирование или экспонирование:","После перерегистрации оружия в федеральном органе исполнительной власти, уполномоченном в сфере оборота оружия, или его территориальном органе по месту жительства лица, приобретающего оружие","После внесения записи о перерегистрации оружия в лицензию нового владельца самим гражданином, продающим оружие","После перерегистрации оружия в федеральном органе исполнительной власти, уполномоченном в сфере оборота оружия, или его территориальном органе по месту учета указанного оружия"],
[44,1,1,"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, принадлежащие гражданам Российской Федерации оружие и патроны по месту их проживания:","Должны храниться с соблюдением условий, обеспечивающих их сохранность, безопасность хранения и исключающих доступ к ним посторонних лиц, в запирающихся на замок (замки) сейфах, сейфовых шкафах или металлических шкафах для хранения оружия, ящиках из высокопрочных материалов либо в деревянных ящиках, обитых железом","Должны храниться с соблюдением условий, обеспечивающих их сохранность, безопасность хранения и исключающих доступ к ним посторонних лиц, в любых запирающихся на замок ящиках","Хранятся в произвольном порядке"],
[45,1,1,"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, хранение оружия и патронов гражданами Российской Федерации в местах временного пребывания:","Должно осуществляться с соблюдением условий, исключающих доступ к оружию посторонних лиц","Должно осуществляться с соблюдением условий, исключающих доступ к оружию посторонних лиц и только в запирающихся на замок (замки) сейфах или металлических шкафах для хранения оружия, ящиках из высокопрочных материалов либо в деревянных ящиках, обитых железом","Осуществляется в произвольном порядке"],
[46,1,1,"Хранение оружия и патронов, принадлежащего гражданам Российской Федерации, являющихся членами спортивных стрелковых обществ и клубов на спортивных стрелково-стендовых объектах по месту проведения тренировочных стрельб и соревнований:","Допускается","Не допускается","Допускается только при условии, что названные граждане являются спортсменами высокого класса"],
[47,1,1,"К условиям, при которых граждане Российской Федерации, которые имеют охотничий билет, имеют право получать лицензию на приобретение охотничьего огнестрельного длинноствольного оружия с нарезным стволом, относятся, среди прочих, следующие:","- занимаются профессиональной деятельностью, связанной с охотой; - владеют непрерывно не менее трех лет охотничьим огнестрельным длинноствольным оружием на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом","- занимаются профессиональной деятельностью, связанной с охотой; - владеют непрерывно не менее пяти лет охотничьим огнестрельным длинноствольным оружием на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом; - владеют охотничьим огнестрельным длинноствольным оружием с нарезным стволом на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом, которое было приобретено на основании лицензии на приобретение такого оружия","- занимаются правоохранительной деятельностью; - владеют непрерывно не менее пяти лет охотничьим огнестрельным длинноствольным оружием на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом; - владеют охотничьим огнестрельным длинноствольным оружием с нарезным стволом на основании разрешения на его хранение и ношение, выданного федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом, которое было приобретено на основании лицензии на приобретение такого оружия"],
[48,1,3,"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, транспортирование принадлежащего гражданам оружия:","Осуществляется в произвольном порядке","Осуществляется в кобурах, чехлах; при их отсутствии - в ингибиторной бумаге","Осуществляется в чехлах, кобурах или специальных футлярах, а также в специальной упаковке производителя оружия"],
[49,1,2,"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации (в части, регулирующей транспортирование принадлежащего гражданам оружия):","Оружие при транспортировании должно быть разряженным только в случае транспортирования в специальной упаковке производителя оружия","Оружие при транспортировании должно находиться в разряженном состоянии отдельно от патронов","Оружие при транспортировании может находиться как в разряженном, так и в заряженном состоянии (по усмотрению владельца)"],
[50,1,3,"При получении заявления о продлении срока действия разрешений на хранение (либо хранение и ношение) оружия, дата и время проверки уполномоченными сотрудниками обеспечения условий хранения (сохранности) оружия и патронов определяется в следующем порядке:","В течение 2 рабочих дней со дня регистрации заявления сотрудник по согласованию с вышестоящим руководством определяет дату и время проверки, о которых заявитель оповещается по его контактным телефонам либо по электронной почте","В течение 2 рабочих дней со дня регистрации заявления сотрудник самостоятельно определяет дату и время проверки, о которых заявитель оповещается по его контактным телефонам либо по электронной почте","В течение 2 рабочих дней со дня регистрации заявления сотрудником совместно с заявителем по контактным телефонам либо путем переписки по электронной почте определяются дата и время проверки"],
[51,1,1,"Имеют ли право на необходимую оборону лица, имеющие возможность избежать общественно опасного посягательства или обратиться за помощью к другим лицам или органам власти?","Да, имеют","Нет, не имеют","Имеют, если посягательство сопряжено с насилием, опасным для жизни обороняющегося"],
[52,1,1,"Правилами оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации установлен следующий порядок ношения огнестрельного короткоствольного оружия:","В кобуре, со снаряженным магазином или барабаном, поставленным на предохранитель (при наличии)","В кобуре, с патроном в патроннике, со взведенным курком","В кобуре, с патроном в патроннике, поставленным на предохранитель (при наличии)"],
[53,1,3,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации ношение гражданами в целях самообороны огнестрельного длинноствольного оружия, холодного оружия и метательного стрелкового оружия:","Разрешается на территории того субъекта Российской Федерации, в котором проживает владелец указанного оружия","Разрешается на всей территории Российской Федерации","Запрещается, за исключением случаев перевозки или транспортирования указанного оружия"],
[54,1,2,"В соответствии с Федеральным законом «Об оружии» гражданское огнестрельное оружие (за исключением спортивного оружия) должно иметь емкость магазина (барабана):","Не более 8 патронов","Не более 10 патронов","Не более 12 патронов"],
[55,1,1,"В соответствии с Федеральным законом «Об оружии» гражданское огнестрельное оружие:","Должно исключать ведение огня очередями","Может вести огонь очередями","Может вести огонь очередями только в случае, когда оно является охотничьим"],
[56,1,1,"Согласно Правил оборота гражданского и служебного оружия и патронов к нему на территории Российской Федерации, граждане Российской Федерации осуществляют ношение и использование оружия (с учетом ограничений, установленных Федеральным законом «Об оружии»):","Во время охоты, проведения спортивных мероприятий, тренировочных и учебных стрельб, а также в целях самообороны","Во время охоты, проведения спортивных мероприятий, тренировочных и учебных стрельб","Только во время охоты и в целях самообороны"],
[57,1,3,"В соответствии с Федеральным законом «Об оружии» осмотр врачом-психиатром и врачом-психиатром-наркологом при проведении медицинского освидетельствования на наличие медицинских противопоказаний к владению оружием и химико-токсикологические исследования наличия в организме человека наркотических средств, психотропных веществ и их метаболитов осуществляется:","В любых медицинских организациях","В медицинских организациях государственной или муниципальной системы здравоохранения только по месту жительства гражданина Российской Федерации","В медицинских организациях государственной или муниципальной системы здравоохранения по месту жительства (пребывания) гражданина Российской Федерации"],
[58,1,2,"В соответствии с Федеральным законом «Об оружии» запрещается ношение огнестрельного оружия:","На стрелковых объектах","В состоянии опьянения","За пределами субъекта Российской Федерации, где зарегистрировано огнестрельное оружие"],
[59,1,3,"В соответствии с Федеральным законом «Об оружии» запрещается ношение гражданами огнестрельного оружия ограниченного поражения:","На стрелковых объектах.","Во время нахождения в организациях, предназначенных для развлечения и досуга (независимо от времени их работы и факта реализации в них алкогольной продукции), за исключением случаев ношения такого оружия лицами, осуществляющими в соответствии с законодательством Российской Федерации охрану указанных организаций.","Во время нахождения в организациях, предназначенных для развлечения и досуга, осуществляющих работу в ночное время и реализующих алкогольную продукцию, за исключением случаев ношения такого оружия лицами, осуществляющими в соответствии с законодательством Российской Федерации охрану указанных организаций"],
[60,1,2,"В соответствии с Кодексом РФ об административных правонарушениях нарушение правил охоты влечет для граждан:","Наложение административного штрафа с конфискацией орудий охоты или без таковой или административный арест до 15 суток","Наложение административного штрафа с конфискацией орудий охоты или без таковой или лишение права осуществлять охоту на установленный законом срок","Только аннулирование (изъятие) охотничьего билета"],
[61,1,1,"В соответствии с Федеральным законом «Об оружии» гражданское огнестрельное оружие ограниченного поражения (пистолет, револьвер, огнестрельное бесствольное устройство отечественного производства) может использоваться:","С патронами травматического действия, патронами газового действия и патронами светозвукового действия","С патронами травматического действия и патронами светозвукового действия","Только с патронами травматического действия"],
[62,1,2,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещен оборот в качестве гражданского оружия:","Огнестрельного длинноствольного оружия, имеющего длину цельного ствола от переднего торца направляющей части канала ствола до казенного среза ствола менее 500 мм; огнестрельного длинноствольного оружия, имеющего общую длину оружия менее 800 мм, а также имеющего конструкцию, которая позволяет сделать его длину менее 800 мм и при этом не теряется возможность производства выстрела","Огнестрельного длинноствольного оружия, имеющего длину цельного ствола от переднего торца направляющей части канала ствола до казенного среза ствола менее 300 мм; огнестрельного длинноствольного оружия, имеющего общую длину оружия менее 700 мм, а также имеющего конструкцию, которая позволяет сделать его длину менее 700 мм и при этом не теряется возможность производства выстрела","Огнестрельного длинноствольного оружия, имеющего длину цельного ствола от переднего торца направляющей части канала ствола до казенного среза ствола менее 400 мм; огнестрельного длинноствольного оружия, имеющего общую длину оружия менее 750 мм, а также имеющего конструкцию, которая позволяет сделать его длину менее 750 мм и при этом не теряется возможность производства выстрела"],
[63,1,2,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается:","Перевозка оружия","Пересылка оружия","Транспортирование оружия"],
[64,1,3,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается оборот в качестве гражданского оружия:","Огнестрельного оружия, которое имеет камуфлированную раскраску","Огнестрельного оружия, содержащего комплектующие детали либо элементы, по виду сходные с комплектующими деталями либо элементами боевого оружия","Огнестрельного оружия, которое имеет форму, имитирующую другие предметы"],
[65,1,3,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается установка на гражданском оружии:","Коллиматорных прицелов и лазерных целеуказателей, а также их продажа при отсутствии соответствующей лицензии на торговлю оружием","Приспособлений для бесшумной стрельбы и прицелов (прицельных комплексов) ночного видения, в том числе прицелов для охоты, порядок использования которых устанавливается Правительством Российской Федерации, а также их продажа","Приспособлений для бесшумной стрельбы и прицелов (прицельных комплексов) ночного видения, за исключением прицелов для охоты, порядок использования которых устанавливается Правительством Российской Федерации, а также их продажа"],
[66,1,1,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается оборот в качестве гражданского оружия:","Патронов с пулями, или пуль, или метаемых снарядов к метательному стрелковому оружию бронебойного, зажигательного, разрывного или трассирующего действия, а также патронов с дробовыми снарядами для газовых пистолетов и револьверов","Патронов с пулями, или пуль, или метаемых снарядов к метательному стрелковому оружию бронебойного, зажигательного, разрывного или трассирующего действия, кроме используемых для охоты, а также патронов с дробовыми снарядами для газовых пистолетов и револьверов","Патронов светозвукового и травматического действия, а также патронов с дробовыми снарядами для охотничьего оружия"],
[67,1,1,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается оборот в качестве гражданского оружия:","Газового оружия, снаряженного нервно-паралитическими, отравляющими, а также другими веществами, не разрешенными к применению федеральным органом исполнительной власти, осуществляющим функции по выработке государственной политики и нормативно-правовому регулированию в сфере здравоохранения","Газового оружия, снаряженного слезоточивыми или раздражающими веществами, разрешенными к применению федеральным органом исполнительной власти, осуществляющим функции по выработке государственной политики и нормативно-правовому регулированию в сфере здравоохранения","Газовых пистолетов и револьверов с емкостью магазина (барабана) более 8 патронов."],
[68,1,2,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации запрещается:","Продажа или передача патронов к гражданскому оружию лицам, не владеющим на законном основании таким гражданским оружием, за исключением передачи патронов лицам, участвующим в совместной охоте с владельцем оружия и патронов","Продажа или передача патронов к гражданскому оружию лицам, не владеющим на законном основании таким гражданским оружием, за исключением передачи патронов лицам, занимающимся в спортивных организациях видами спорта, связанными с использованием огнестрельного оружия, или проходящим стрелковую подготовку в образовательных организациях","Продажа или передача патронов к гражданскому оружию лицам, не владеющим на законном основании таким гражданским оружием, за исключением случаев передачи патронов лицам, являющимся членами семьи и проживающим совместно с владельцем оружия и патронов"],
[69,1,1,"В соответствии с Федеральным законом «Об оружии» на территории Российской Федерации не запрещается:","Продажа или передача инициирующих и воспламеняющих веществ и материалов (пороха, капсюлей) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию гражданам, имеющим разрешения на хранение и ношение такого оружия","Продажа или передача инициирующих и воспламеняющих веществ и материалов (пороха, капсюлей) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию гражданам, не имеющим разрешения на хранение и ношение такого оружия, но участвующим в совместной охоте с лицами, имеющими соответствующие разрешения","Продажа или передача инициирующих и воспламеняющих веществ и материалов (пороха, капсюлей) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию гражданам, не имеющим разрешения на хранение и ношение такого оружия, но проживающим совместно с лицами, имеющими соответствующие разрешения"],
[70,1,2,"Правилами охоты установлено, что проверка боя охотничьего оружия и приведение его к нормальному бою (далее - пристрелка) должна производиться (вопрос не используется при проверке на продление разрешений):","Только на специально оборудованных стрельбищах или площадках","На специально оборудованных стрельбищах или площадках, либо в охотничьих угодьях только в период охоты при наличии у охотника документов на право осуществления охоты","На специально оборудованных стрельбищах или площадках, либо в охотничьих угодьях (независимо от того, происходит ли это в период охоты)"],
[71,1,3,"Правилами охоты установлено, что при заряжании или разряжании охотничьего оружия его следует направлять стволами:","Только вверх","Только в землю","Только вверх или в землю, отвернувшись в сторону от других физических лиц"],
[72,1,1,"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается (вопрос не используется при проверке на продление разрешений):","Стрелять «на шум», «на шорох», по неясно видимой цели","Стрелять, если цель находится на возвышенности","Стрелять в болотистой местности"],
[73,1,2,"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается осуществлять добычу охотничьих животных с применением охотничьего оружия ближе (вопрос не используется при проверке на продление разрешений):","100 метров от жилого дома, жилого строения","200 метров от жилого дома, жилого строения","300 метров от жилого дома, жилого строения"],
[74,1,3,"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается (вопрос не используется при проверке на продление разрешений):","Стрелять по пернатой дичи, находящейся в стае","Стрелять по пернатой дичи, сидящей на нижних ветках деревьев","Стрелять по пернатой дичи, сидящей на проводах и опорах (столбах) линий электропередач"],
[75,1,3,"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается стрелять вдоль линии стрелков, когда снаряд может пройти ближе (вопрос не используется при проверке на продление разрешений):","25 метров от соседнего стрелка","20 метров от соседнего стрелка","15 метров от соседнего стрелка"],
[76,1,2,"Правилами охоты установлено, что в целях обеспечения безопасности при осуществлении охоты запрещается организовывать загон охотничьих животных (вопрос не используется при проверке на продление разрешений):","При котором животных загоняют в направлении к реке или иному водоему","При котором охотники движутся внутрь загона, окружая оказавшихся в загоне животных","При котором загонщики используют какие-либо дополнительные средства производства шума, помимо собственного голоса"],
[77,1,1,"Правилами охоты запрещается стрелять ниже 2,5 метров по взлетающей и летящей птице (вопрос не используется при проверке на продление разрешений):","При осуществлении охоты в зарослях, кустах и ограниченном обзоре местности","При любом осуществлении охоты, независимо от ее условий","При использовании полуавтоматического оружия"],
[78,1,1,"Правилами охоты установлено, что при осуществлении охоты запрещается применение охотничьего огнестрельного гладкоствольного оружия для охоты на пернатую дичь (вопрос не используется при проверке на продление разрешений):","Снаряженного дробью (картечью) крупнее пяти миллиметров и пулями","Снаряженного дробью (картечью) крупнее четырех миллиметров и пулями","Снаряженного дробью (картечью) крупнее трех миллиметров и пулями"],
[79,1,3,"Организациям, осуществляющим торговлю оружием и патронами к нему, не запрещается продавать инициирующие и воспламеняющие вещества и материалы (порох, капсюли) для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию либо для заряжания оружия, имеющего культурную ценность, копий старинного (антикварного) огнестрельного оружия и реплик старинного (антикварного) огнестрельного оружия (вопрос не используется при проверке на продление разрешений):","Любым гражданам, достигшим возраста 18 лет","Гражданам, проходящим службу в государственных военизированных организациях и имеющим воинские звания либо специальные звания или классные чины юстиции (независимо от наличия у них разрешения на хранение и ношение гражданского огнестрельного длинноствольного оружия)","Гражданам, представившим разрешение на хранение и ношение гражданского огнестрельного длинноствольного оружия."],
[80,1,2,"Не подлежат продаже вещества и материалы для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию (вопрос не используется при проверке на продление разрешений):","Произведенные за пределами Российской Федерации.","Упаковка которых не содержит сведений о правилах их безопасного использования для самостоятельного снаряжения патронов к гражданскому огнестрельному длинноствольному оружию.","Вес упаковки которых превышает 100 гр."],
[81,1,1,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, право на приобретение гражданского огнестрельного оружия ограниченного поражения, охотничьего оружия, огнестрельного гладкоствольного длинноствольного оружия самообороны имеют:","Граждане Российской Федерации, достигшие возраста 21 года (возможность более раннего приобретения допускается законом только для отдельных категорий граждан)","Все граждане Российской Федерации, достигшие возраста 20 лет","Все граждане Российской Федерации, достигшие возраста 18 лет"],
[82,1,2,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, гражданам Российской Федерации, получившим лицензию на приобретение гражданского огнестрельного длинноствольного оружия:","До истечения первого года владения таким оружием не разрешается приобретать в целях самообороны или охоты огнестрельное гладкоствольное длинноствольное оружие, имеющее более двух стволов или магазин (барабан)","До истечения первых двух лет владения таким оружием не разрешается приобретать в целях самообороны или охоты огнестрельное гладкоствольное длинноствольное оружие, имеющее более двух стволов или магазин (барабан)","До истечения первых трех лет владения таким оружием не разрешается приобретать в целях самообороны или охоты огнестрельное гладкоствольное длинноствольное оружие, имеющее более двух стволов или магазин (барабан)"],
[83,1,3,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, право на приобретение газового оружия, спортивного оружия, охотничьего огнестрельного гладкоствольного длинноствольного оружия и охотничьего огнестрельного длинноствольного оружия с нарезным стволом для занятий спортом, сигнального оружия, холодного клинкового оружия, предназначенного для ношения с национальными костюмами народов Российской Федерации или казачьей формой имеют:","Только граждане Российской Федерации, достигшие возраста 21 года","Только граждане Российской Федерации, достигшие возраста 20 лет","Граждане Российской Федерации, достигшие возраста 18 лет"],
[84,1,2,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, гладкоствольное огнестрельное оружие определяется как:","Огнестрельное оружие, канал ствола которого имеет круглое сечение, цилиндрическую или коническую форму и гладкую (ровную) внутреннюю поверхность с длиной нарезной части не более 140 мм","Огнестрельное оружие, канал ствола которого имеет круглое сечение, цилиндрическую или коническую форму и гладкую (ровную) внутреннюю поверхность на всем его протяжении","Огнестрельное оружие, канал ствола которого имеет круглое сечение, цилиндрическую или коническую форму и гладкую (ровную) внутреннюю поверхность (с длиной нарезной части не более 140 мм – только для охотничьего огнестрельного гладкоствольного длинноствольного оружия)"],
[85,1,3,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, переделка оружия - замена или изменение формы и (или) размеров основных частей огнестрельного оружия либо деталей ударного и спускового механизмов оружия, замена или изменение частей списанного оружия, пневматического оружия, сигнального оружия, газового оружия или метательного стрелкового оружия:","Которые повлекли изменение технических характеристик оружия, учитываемых при сертификации оружия (обязательном подтверждении соответствия); при этом факт уничтожения или изменения маркировочных обозначений, номера и (или) клейма оружия понятием о переделке оружия не охватывается","Которые повлекли уничтожение или изменение маркировочных обозначений, номера и (или) клейма оружия; при этом факт изменения технических характеристик оружия, учитываемых при сертификации оружия (обязательном подтверждении соответствия) понятием о переделке оружия не охватывается","Которые повлекли изменение технических характеристик оружия, учитываемых при сертификации оружия (обязательном подтверждении соответствия), уничтожение или изменение маркировочных обозначений, номера и (или) клейма оружия"],
[86,1,2,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, собственник списанного оружия обязан уведомить федеральный орган исполнительной власти, уполномоченный в сфере оборота оружия, или его территориальный орган:","В течение десяти дней со дня приобретения этого оружия для его регистрации","В двухнедельный срок со дня приобретения этого оружия для его регистрации","В месячный срок со дня приобретения этого оружия для его регистрации"],
[87,1,1,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, лицензия на приобретение оружия не выдается гражданам Российской Федерации:","Два и более раза осужденным за совершение преступления","Хотя бы один раз осужденным за совершение любого преступления","Когда-либо ранее находившимся под следствием по уголовному делу (независимо от результата рассмотрения дела)"],
[88,1,2,"В соответствии с положениями Федерального закона «Об оружии», лицензия на приобретение оружия не выдается гражданам Российской Федерации:","Имеющим неснятую или непогашенную судимость за любое преступление, в том числе совершенное по неосторожности","Имеющим неснятую или непогашенную судимость за умышленное преступление, а также подозреваемым или обвиняемым в совершении умышленного преступления","Когда-либо ранее находившимся под следствием по уголовному делу (независимо от результата рассмотрения дела)"],
[89,1,3,"В соответствии с положениями Федерального закона «Об оружии», не запрещена выдача лицензии на приобретение оружия гражданам Российской Федерации, имеющим снятую или погашенную судимость:","За умышленное преступление, связанное с незаконным оборотом оружия и патронов к нему, боеприпасов, взрывчатых веществ или взрывных устройств","За умышленное преступление, совершенное с применением насилия в отношении несовершеннолетнего (несовершеннолетней)","За умышленное преступление в сфере компьютерной информации, относящееся к преступлениям небольшой или средней тяжести"],
[90,1,1,"В соответствии с положениями Федерального закона «Об оружии», не запрещена выдача лицензии на приобретение оружия гражданам Российской Федерации, имеющим снятую или погашенную судимость:","За преступление небольшой или средней тяжести, выразившееся в нарушении правил дорожного движения и эксплуатации транспортных средств","За преступление террористического характера и (или) экстремистской направленности, а также за преступление, совершенное в целях пропаганды, оправдания и поддержки терроризма","За тяжкое или особо тяжкое преступление, а также за умышленное преступление средней тяжести, совершенное с применением (использованием) оружия, предметов, используемых в качестве оружия, боеприпасов, взрывчатых веществ, взрывных или имитирующих их устройств, специально изготовленных технических средств, наркотических средств, психотропных, сильнодействующих, ядовитых и радиоактивных веществ, лекарственных и иных химико-фармакологических препаратов"],
[91,1,1,"В соответствии с положениями Федерального закона «Об оружии», вступившими в силу с 29 июня 2022 года, лицензия на приобретение оружия не выдается гражданам Российской Федерации, привлеченным к административной ответственности за совершение административного правонарушения, предусматривающего административный арест в качестве одного из видов административного наказания, а также привлеченным к административной ответственности за потребление наркотических средств или психотропных веществ без назначения врача либо новых потенциально опасных психоактивных веществ, за управление транспортным средством в состоянии опьянения либо передачу управления транспортным средством лицу, находящемуся в состоянии опьянения, либо невыполнение водителем транспортного средства законного требования уполномоченного должностного лица о прохождении медицинского освидетельствования на состояние опьянения, либо невыполнение законного требования уполномоченного должностного лица о прохождении медицинского освидетельствования на состояние опьянения гражданином, в отношении которого имеются достаточные основания полагать, что он потребил наркотические средства или психотропные вещества без назначения врача либо новые потенциально опасные психоактивные вещества:","До истечения одного года со дня окончания срока, в течение которого лицо считается подвергнутым административному наказанию","До истечения шести месяцев со дня окончания срока, в течение которого лицо считается подвергнутым административному наказанию","До окончания срока, в течение которого лицо считается подвергнутым административному наказанию"],
[92,1,3,"В соответствии с Федеральным законом «Об оружии» граждане Российской Федерации, имеющие охотничий билет и владевшие охотничьим огнестрельным длинноствольным оружием с нарезным стволом, которое было приобретено на основании лицензии на приобретение такого оружия или владевшие непрерывно не менее пяти лет охотничьим огнестрельным длинноствольным оружием, на основании соответствующих разрешений на его хранение и ношение, выданных федеральным органом исполнительной власти, уполномоченным в сфере оборота оружия, или его территориальным органом, имеют право получать лицензию на приобретение охотничьего огнестрельного длинноствольного оружия с нарезным стволом, если со дня истечения срока действия указанного разрешения или его аннулирования на основании добровольного отказа гражданина от указанного разрешения прошло:","Не более пяти лет","Не более трех лет","Не более одного года"],
[93,1,2,"В соответствии с положениями Федерального закона «Об оружии», не запрещена выдача лицензии на приобретение оружия гражданам Российской Федерации:","Освобожденным судом от уголовной ответственности за совершение умышленного преступления с назначением судебного штрафа либо по основаниям, не дающим права на реабилитацию в соответствии с уголовно-процессуальным законодательством Российской Федерации, - до истечения двух лет со дня вступления в законную силу соответствующего решения суда","Освобожденным судом от уголовной ответственности за совершение умышленного преступления по основаниям, дающим право на реабилитацию в соответствии с уголовно-процессуальным законодательством Российской Федерации","В отношении которых по результатам проверки, проведенной органами внутренних дел и (или) органами федеральной службы безопасности, имеется заключение о наличии опасности нарушения прав и свобод граждан, угрозы государственной или общественной безопасности"],
[94,2,2,"Линией прицеливания называется:","Линия, проходящая от центра ствола в точку прицеливания","Прямая линия, проходящая от глаза стрелка через середину прорези прицела (на уровне с ее краями) и вершину мушки в точку прицеливания","Линия, описываемая центром тяжести пули в полете"],
[95,2,1,"Траекторией полета пули называется:","Кривая линия, описываемая центром тяжести пули в полете","Прямая линия, проходящая от глаза стрелка через середину прорези прицела (на уровне с ее краями) и вершину мушки в точку прицеливания","Прямая линия от центра ствола до точки попадания"],
[96,2,3,"Прямым выстрелом называется:","Выстрел, при котором траектория полета пули поднимается над линией прицеливания выше цели не более, чем на одной трети своего протяжения","Выстрел, при котором ствол оружия и линия плеч стрелка составляют прямой угол","Выстрел, при котором траектория полета пули не поднимается над линией прицеливания выше цели на всем своем протяжении"],
[97,2,3,"Каков порядок действий стрелка при проведении стрельб в тирах и на стрельбищах?","Стрелок самостоятельно выходит на линию огня, по команде «Заряжай» заряжает оружие и по команде «Огонь» ведет огонь","Стрелок по команде «На линию огня» выходит на огневой рубеж, самостоятельно заряжает, стреляет","Стрелок выходит, заряжает, стреляет, производит иные действия только по мере получения отдельных команд"],
[98,2,1,"Какова предельная дальность полета пуль из огнестрельного гладкоствольного длинноствольного оружия 12 калибра?","1000 - 1500 метров","300 - 500 метров","100 - 300 метров"],
[99,2,3,"В случае задержки при стрельбе из пистолета в тире необходимо:","Осторожно вынуть магазин из основания рукоятки, устранить причину задержки, продолжить выполнение упражнения","Поставить оружие на предохранитель, вынуть магазин из основания рукоятки, сдать оружие руководителю стрельб (инструктору)","Не производить никаких действий с оружием и удерживая его в направлении мишени, доложить руководителю стрельб (инструктору) о задержке и действовать по его команде"],
[100,2,1,"Как следует производить перезарядку огнестрельного гладкоствольного длинноствольного оружия с помповым механизмом?","Быстрым движением цевья назад, и не задерживая в заднем положении, быстрым вперед","Медленно назад и быстро вперед","Быстро назад и медленно вперед"],
[101,2,1,"Безопасное использование оружия предполагает в период непосредственного применения:","Держать указательный палец вдоль спусковой скобы, переставляя его на спусковой крючок только перед выстрелом","Держать указательный палец всегда на спусковом крючке","Удерживая оружие двумя руками, всегда держать указательные пальцы (один на другом) на спусковом крючке"],
[102,2,3,"Безопасное использование оружия предполагает в период непосредственного применения:","Ни при каких обстоятельствах не ставить оружие на предохранитель","Не ставить оружие на предохранитель после досылания патрона в патронник, даже если оружие не применяется сразу после досылания патрона","Ставить оружие на предохранитель после досылания патрона в патронник, если оружие не применяется сразу после досылания патрона"],
[103,2,2,"Безопасное использование оружия предполагает в период непосредственного применения:","При досылании патрона в патронник не отвлекаться на контроль направления ствола оружия","Осуществлять обязательный контроль направления ствола оружия при досылании патрона в патронник для исключения возможного вреда самому владельцу оружия, посторонним лицам и имуществу","Осуществлять контроль направления ствола оружия при досылании патрона в патронник только в ситуациях близости несовершеннолетних или ценного имущества"],
[104,2,2,"Безопасное использование оружия предполагает в период непосредственного применения:","Не отвлекаться на расчет траектории выстрела (в части исключения вреда посторонним лицам и/или вреда их имуществу)","Обеспечивать траекторию выстрела, исключающую причинение вреда посторонним лицам, а по возможности и их имуществу","Рассчитывать траекторию выстрела только в местах массового скопления людей"],
[105,2,2,"Безопасное использование оружия при его ношении предполагает передачу оружия лицу, уполномоченному на его проверку:","С патроном в патроннике и присоединенным магазином","С отсоединенным магазином и после проверки факта отсутствия патрона в патроннике","В том состоянии, которого потребовал проверяющий"],
[106,2,2,"При стрельбе в тире в противошумовых наушниках или защитных очках действуют следующие правила:","Следует закрепить их во избежание падения во время стрельбы","Запрещается надевать, поправлять и снимать их с оружием в руках","Разрешается надевать, поправлять и снимать их с оружием в руках"],
[107,2,2,"Во время перемещения по тиру или стрельбищу (осмотр мишеней и т.п.) в соответствии с мерами по обеспечению безопасности:","Оружие должно находиться в руках стрелка","Оружие должно находиться в кобуре стрелка или на столике стрелка в разряженном и поставленном на предохранитель виде","Оружие по усмотрению стрелка либо находится в руках стрелка, либо помещается в кобуру стрелка"],
[108,2,3,"Неполная разборка пистолета (для пистолетов, по конструкции сходных с пистолетом Макарова) производится в следующем порядке:","Отделить затвор, отвинтить винт рукоятки, отделить рукоятку от рамки, снять возвратную пружину","Выключить предохранитель (если таковой имеется), отвести спусковую скобу вниз и влево, отделить затвор от рамки, поставить спусковую скобу на место, снять со ствола возвратную пружину","Извлечь магазин из основания рукоятки, выключить предохранитель (если таковой имеется), убедиться в отсутствии патрона в патроннике, отвести спусковую скобу вниз и влево, отделить затвор от рамки, поставить спусковую скобу на место, снять со ствола возвратную пружину"],
[109,2,2,"Отдачей оружия называется:","Подбрасывание ствола оружия в вертикальной плоскости при выстреле","Движение ствола и связанных с ним деталей оружия в сторону, противоположную движению снаряда (пули) во время выстрела","Передача разряженного и поставленного на предохранитель оружия инструктору (руководителю стрельбы) по окончании стрельб"],
[110,2,2,"Согласно рекомендациям предприятий-производителей после стрельбы из пистолетов (револьверов) газовыми патронами их чистка производится:","Сухой тканью","Тканью, смоченной спиртом или спиртовым раствором","Тканью, смоченной ружейной смазкой"],
[111,2,3,"Смазку оружия положено производить:","Одновременно с чисткой","По истечении 10 минут после чистки","Немедленно после чистки"],
[112,2,1,"Для эффективного поражения цели предполагается ведение огня (в зависимости от дистанции):","На дистанции, не превышающей рекомендуемую для данного оружия","На любой дистанции (в том числе и превышающей рекомендуемую для данного оружия)","На дистанции, не превышающей максимальную дальность полета пули из данного оружия"],
[113,2,2,"Меры безопасности при проведении на стрелковых объектах специальных упражнений (связанных с поворотами, разворотами, кувырками, перекатами и т.п.) предполагают:","Обязательное применение оружия, предназначенного для подразделений специального назначения","Нахождение оружия на предохранителе вплоть до момента открытия огня, направление оружия и производство выстрелов только по мишеням, установленным перед пулеприемником (пулеприемниками)","Надежное удержание оружия при передвижениях, без каких-либо дополнительных требований"],
[114,2,3,"Для временного прекращения стрельбы в тире (на стрельбище) подается команда:","«Оружие к осмотру»","«Разряжай»","«Стой»"],
[115,2,2,"Действия по временному прекращению стрельбы в тире (на стрельбище) или в ходе применения оружия гражданином в ситуациях необходимой обороны или крайней необходимости:","Прекратить нажим на хвост спускового крючка; извлечь магазин (для оружия, имеющего магазин), произвести контрольный спуск курка (в условиях безопасности по направлению возможного выстрела), включить предохранитель (если таковой имеется)","Прекратить нажим на хвост спускового крючка; включить предохранитель (если таковой имеется); при необходимости – перезарядить оружие","Прекратить нажим на хвост спускового крючка; извлечь магазин (для оружия, имеющего магазин), произвести контрольный спуск курка (в условиях безопасности по направлению возможного выстрела)"],
[116,2,2,"В случае неполного израсходования патронов в тире (на стрельбище) подается команда:","«Оружие к осмотру»","«Разряжай»","«Стой»"],
[117,2,3,"Действия при завершении стрельбы в тире (на стрельбище):","Прекратить нажим на хвост спускового крючка, включить предохранитель (если таковой имеется), в случае неполного израсходования патронов по команде «Разряжай» разрядить оружие (согласно правилам, установленным для данного оружия), далее произвести контрольный спуск курка (в условиях безопасности по направлению возможного выстрела)","Прекратить нажим на хвост спускового крючка; включить предохранитель (если таковой имеется)","Прекратить нажим на хвост спускового крючка, включить предохранитель (если таковой имеется), в случае неполного израсходования патронов по команде «Разряжай» разрядить оружие (согласно правилам, установленным для данного оружия); далее действовать по командам «Оружие – к осмотру» и «Отбой»"],
[118,2,2,"Действия с пистолетом при получении в тире (на стрельбище) команды «Оружие – к осмотру»:","Извлечь магазин, предъявить оружие к осмотру (в положении «на затворной задержке») с приложенным сбоку (под большой палец правой руки) магазином. После осмотра оружия руководителем стрельбы (по команде «осмотрено») поставить оружие на предохранитель; магазин вставить в основание рукоятки, и в зависимости от доведенных условий стрельбы - вложить пистолет в кобуру или поместить его на стойку (столик) стрелка","Извлечь магазин, предъявить оружие к осмотру (в положении «на затворной задержке») с приложенным сбоку (под большой палец правой руки) магазином. После осмотра оружия руководителем стрельбы (по команде «осмотрено») снять с затворной задержки, произвести контрольный спуск курка, поставить оружие на предохранитель; магазин вставить в основание рукоятки, и в зависимости от доведенных условий стрельбы - вложить пистолет в кобуру или поместить его на стойку (столик) стрелка","Извлечь магазин, предъявить оружие к осмотру (в положении «на затворной задержке») с приложенным сбоку (под большой палец правой руки) магазином. После осмотра оружия руководителем стрельбы (по команде «осмотрено») снять с затворной задержки, произвести контрольный спуск курка, поставить оружие на предохранитель"],

/* ==========================================================================
   Хранилище прогресса. Единственный источник состояния между запусками.

   Почему localStorage, а не IndexedDB: объём данных — единицы килобайт,
   доступ синхронный, транзакции не нужны. IndexedDB здесь дал бы асинхронность
   и код восстановления схемы без выигрыша.

   Риск, который надо понимать: в обычной вкладке Safari (не установленное PWA)
   iOS может очистить localStorage после 7 дней без визитов. Установка на
   домашний экран выводит хранилище из-под этого правила, но гарантий нет —
   поэтому в приложении есть экспорт/импорт прогресса файлом.
   ========================================================================== */

const Store = (function () {
  const KEY = 'boo2026.state';
  const VERSION = 2;

  const DEFAULTS = {
    v: VERSION,
    progress: {},        // qid -> { s, c, w, st, lr, l }
    exams: [],           // история попыток экзамена (последние 50)
    settings: {
      theme: 'auto',           // auto | dark | light
      shuffleOptions: true,    // перемешивать варианты
      timerEnabled: true,      // таймер в экзамене
      timerSec: 600,           // 10 минут
      examScope: 'initial',    // initial | renewal (при продлении часть вопросов не используется)
      instantFeedback: true,   // показывать верный ответ сразу (тренировка)
      haptics: true
    }
  };

  /* Доступность хранилища проверяется реальной записью, а не наличием
     window.localStorage: объект существует и в приватном режиме Safari, и на
     file://, но бросает на первой же записи. Знать это нужно до первого ответа
     пользователя — иначе он сдаёт экзамен, а прогресс молча не сохраняется. */
  /* Порядок объявлений важен: probe() пишет в storageError, поэтому
     переменная должна быть инициализирована ДО вызова. Иначе на пути отказа
     хранилища получаем ReferenceError по временной мёртвой зоне, и модуль
     не загружается целиком — ровно в том сценарии, ради которого написан. */
  let storageError = '';
  let storageOK = probe();

  function probe() {
    try {
      const k = KEY + '.probe';
      localStorage.setItem(k, '1');
      const ok = localStorage.getItem(k) === '1';
      localStorage.removeItem(k);
      return ok;
    } catch (e) {
      storageError = e && e.name ? e.name : 'ошибка доступа';
      return false;
    }
  }

  let state = load();
  let saveTimer = null;

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* приватный режим */ }
    if (!raw) return clone(DEFAULTS);
    try {
      const parsed = JSON.parse(raw);
      return migrate(parsed);
    } catch (e) {
      console.warn('[store] повреждённое состояние, сброс', e);
      return clone(DEFAULTS);
    }
  }

  function migrate(s) {
    if (!s || typeof s !== 'object') return clone(DEFAULTS);
    const out = clone(DEFAULTS);
    if (s.progress && typeof s.progress === 'object') {
      for (const k in s.progress) {
        const p = s.progress[k];
        if (!p) continue;
        out.progress[k] = {
          s: num(p.s), c: num(p.c), w: num(p.w),
          st: num(p.st), lr: p.lr === 1 ? 1 : 0, l: num(p.l)
        };
      }
    }
    if (Array.isArray(s.exams)) out.exams = s.exams.slice(-50);
    if (s.settings) Object.assign(out.settings, s.settings);
    out.v = VERSION;
    return out;
  }

  function num(x) { return typeof x === 'number' && isFinite(x) ? x : 0; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* Отложенная запись — только для настроек, где пользователь может быстро
     щёлкать переключателями. Ответы на вопросы пишутся сразу (см. record):
     сериализация ~15 КБ занимает доли миллисекунды, а отложенная запись
     означала бы окно, в котором закрытие приложения теряет последний ответ. */
  function save() {
    if (saveTimer) return;
    saveTimer = setTimeout(function () { saveTimer = null; write(); }, 150);
  }

  function write() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      storageOK = true;
      storageError = '';
      return true;
    } catch (e) {
      /* Чаще всего QuotaExceededError в приватном режиме Safari либо
         SecurityError на file://. Молча глотать нельзя: пользователь должен
         знать, что его прогресс не сохраняется. */
      storageOK = false;
      storageError = e && e.name ? e.name : 'ошибка записи';
      console.warn('[store] запись не удалась:', storageError);
      return false;
    }
  }

  function flush() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    return write();
  }

  function available() { return storageOK; }
  function lastError() { return storageError; }

  // ---- прогресс -----------------------------------------------------------

  function stat(qid) {
    return state.progress[qid] || { s: 0, c: 0, w: 0, st: 0, lr: 0, l: 0 };
  }

  function record(qid, isCorrect) {
    const p = state.progress[qid] || { s: 0, c: 0, w: 0, st: 0, lr: 0, l: 0 };
    p.s += 1;
    if (isCorrect) { p.c += 1; p.st += 1; p.lr = 1; }
    else           { p.w += 1; p.st = 0;  p.lr = 0; }
    p.l = Date.now();
    state.progress[qid] = p;
    flush();          // ответ сохраняется немедленно, без окна потери
  }

  /** Вопрос «на исправлении»: были ошибки и ещё нет двух верных подряд. */
  function isWeak(qid) {
    const p = stat(qid);
    return p.w > 0 && p.st < 2;
  }

  /** Вопрос считается освоенным при двух верных ответах подряд. */
  function isLearned(qid) {
    return stat(qid).st >= 2;
  }

  function weakIds(all) {
    return all.filter(function (q) { return isWeak(q.id); }).map(function (q) { return q.id; });
  }

  function summary(all) {
    let learned = 0, weak = 0, touched = 0, answers = 0, right = 0;
    all.forEach(function (q) {
      const p = stat(q.id);
      if (p.s > 0) touched++;
      answers += p.s; right += p.c;
      if (isLearned(q.id)) learned++;
      else if (isWeak(q.id)) weak++;
    });
    return {
      total: all.length, learned: learned, weak: weak, touched: touched,
      answers: answers, right: right,
      accuracy: answers ? Math.round(right / answers * 100) : 0
    };
  }

  // ---- экзамены -----------------------------------------------------------

  function addExam(rec) {
    state.exams.push(rec);
    if (state.exams.length > 50) state.exams = state.exams.slice(-50);
    flush();
  }
  function exams() { return state.exams.slice().reverse(); }

  // ---- настройки ----------------------------------------------------------

  function settings() { return state.settings; }
  function set(key, value) { state.settings[key] = value; save(); }

  // ---- обслуживание -------------------------------------------------------

  function resetProgress() {
    state.progress = {}; state.exams = []; flush();
  }

  function exportJSON() {
    flush();
    return JSON.stringify({
      app: 'boo2026', exported: new Date().toISOString(), bank: BANK_VERSION, state: state
    }, null, 2);
  }

  function importJSON(text) {
    const obj = JSON.parse(text);
    const src = obj && obj.state ? obj.state : obj;
    state = migrate(src);
    flush();
  }

  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') flush();
  });

  return {
    stat: stat, record: record, isWeak: isWeak, isLearned: isLearned,
    weakIds: weakIds, summary: summary,
    addExam: addExam, exams: exams,
    settings: settings, set: set,
    available: available, lastError: lastError,
    resetProgress: resetProgress, exportJSON: exportJSON, importJSON: importJSON,
    flush: flush
  };
})();
