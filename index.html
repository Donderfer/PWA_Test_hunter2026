/* ==========================================================================
   БОО 2026 — логика приложения.

   Архитектура: один модуль, hash-роутер, рендер экранов строками + делегирование
   событий на контейнер. Фреймворк не берём осознанно: экранов семь, состояние
   плоское, а любая зависимость из CDN ломает главное требование — автономность.

   Единый «движок сессии» (Session) обслуживает экзамен, тренировку и работу над
   ошибками; режимы отличаются только правилами набора вопросов и обратной связи.
   ========================================================================== */

(function () {
  'use strict';

  const RENEWAL_EXCLUDE = 'не используется при проверке на продление';
  const EXAM_SIZE = 10;
  const EXAM_MAX_ERRORS = 1;

  const $screen  = document.getElementById('screen');
  const $title   = document.getElementById('topbar-title');
  const $back    = document.getElementById('btn-back');
  const $slot    = document.getElementById('topbar-slot');
  const $tabbar  = document.getElementById('tabbar');
  const $toast   = document.getElementById('toast');

  let session = null;        // активная сессия вопросов
  let timerId = null;
  let toastId = null;

  /* ---------------------------- утилиты --------------------------------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /** Fisher–Yates. Math.random здесь достаточно: это тренажёр, не лотерея. */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function fmtTime(sec) {
    const m = Math.floor(Math.max(0, sec) / 60), s = Math.max(0, sec) % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function fmtDate(ts) {
    const d = new Date(ts);
    const p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function toast(msg) {
    $toast.textContent = msg;
    $toast.hidden = false;
    clearTimeout(toastId);
    toastId = setTimeout(function () { $toast.hidden = true; }, 2200);
  }

  /* Тактильный отклик. На iOS Safari navigator.vibrate не поддерживается —
     вызов молча ничего не делает, отдельная ветка не нужна. */
  function buzz(pattern) {
    if (!Store.settings().haptics) return;
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
  }

  function pool(scope) {
    if (scope === 'renewal') {
      return QUESTIONS.filter(function (q) { return q.q.indexOf(RENEWAL_EXCLUDE) === -1; });
    }
    return QUESTIONS;
  }

  /* ---------------------------- движок сессии ---------------------------- */

  /**
   * mode: 'exam' | 'train' | 'errors'
   * items: массив вопросов в порядке показа
   */
  function Session(mode, items, opts) {
    opts = opts || {};
    this.mode = mode;
    this.items = items;
    this.idx = 0;
    this.answers = [];             // { id, picked, correct, ok }
    this.startedAt = Date.now();
    this.limitSec = opts.limitSec || 0;
    this.deadline = this.limitSec ? Date.now() + this.limitSec * 1000 : 0;
    this.instant = opts.instant !== false;   // показывать верный ответ сразу
    this.locked = false;                     // ответ на текущий вопрос уже дан
    this.order = items.map(function (q) {
      const idxs = Store.settings().shuffleOptions ? shuffle([0, 1, 2]) : [0, 1, 2];
      return idxs;
    });
  }

  Session.prototype.current = function () { return this.items[this.idx]; };
  Session.prototype.errors = function () {
    return this.answers.filter(function (a) { return !a.ok; }).length;
  };
  Session.prototype.finished = function () { return this.idx >= this.items.length; };

  Session.prototype.answer = function (displayPos) {
    const q = this.current();
    const map = this.order[this.idx];
    const realIdx = map[displayPos];           // 0..2 в исходном порядке
    const ok = (realIdx + 1) === q.correct;
    this.answers.push({ id: q.id, picked: realIdx, correct: q.correct - 1, ok: ok });
    Store.record(q.id, ok);
    this.locked = true;
    return ok;
  };

  Session.prototype.next = function () { this.idx++; this.locked = false; };

  /* ------------------------------ роутер --------------------------------- */

  const routes = {
    '/':         screenHome,
    '/train':    screenTrainSetup,
    '/run':      screenRun,
    '/result':   screenResult,
    '/study':    screenStudy,
    '/errors':   screenErrors,
    '/stats':    screenStats,
    '/settings': screenSettings
  };

  function parseHash() {
    const h = location.hash.replace(/^#/, '') || '/';
    const qi = h.indexOf('?');
    const path = qi === -1 ? h : h.slice(0, qi);
    const params = {};
    if (qi !== -1) {
      h.slice(qi + 1).split('&').forEach(function (kv) {
        const p = kv.split('=');
        params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
    }
    return { path: path || '/', params: params };
  }

  function render() {
    const r = parseHash();
    const fn = routes[r.path] || screenHome;
    stopTimer();
    $slot.innerHTML = '';
    const isTab = ['/', '/study', '/errors', '/stats'].indexOf(r.path) !== -1;
    /* На вкладках «Назад» не нужен: переключение идёт таббаром, а history.back()
       увёл бы в непредсказуемое место истории. */
    $back.hidden = isTab;
    $tabbar.hidden = (r.path === '/run');
    Array.prototype.forEach.call($tabbar.querySelectorAll('.tab'), function (a) {
      if (isTab && a.dataset.tab === r.path) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    $screen.scrollTop = 0;
    fn(r.params);
  }

  function go(path) { location.hash = '#' + path; }

  /* ------------------------------ Главная -------------------------------- */

  /**
   * Предупреждение о недоступном хранилище. Показывается, только если запись
   * реально не проходит: молчаливая потеря прогресса — худший из возможных
   * исходов, пользователь узнаёт о ней, уже отработав десятки вопросов.
   */
  function storageWarning() {
    if (Store.available()) return '';
    const fileMode = location.protocol === 'file:';
    const why = fileMode
      ? 'Приложение открыто как файл с диска. В этом режиме браузер запрещает сайту сохранять данные.'
      : 'Браузер отказал в доступе к хранилищу (' + esc(Store.lastError()) +
        '). Обычно это приватное окно или страница внутри встроенного просмотрщика.';
    return '<div class="card" style="border-color:var(--bad);background:var(--bad-soft)">' +
      '<div class="menu__title" style="color:var(--bad)">Прогресс не сохраняется</div>' +
      '<div class="small" style="margin-top:6px">' + why +
      ' Результаты пропадут при закрытии.<br><br>' +
      'Откройте приложение по адресу <b>https://</b> и добавьте его на домашний экран — тогда прогресс будет храниться постоянно.</div>' +
      '</div>';
  }

  function screenHome() {
    $title.textContent = 'БОО 2026';
    const s = Store.summary(QUESTIONS);
    const weak = s.weak;
    const pct = Math.round(s.learned / s.total * 100);
    const last = Store.exams()[0];

    /* Показываем и «отвечено», и «освоено». Раньше была только освоенность,
       и после нескольких верных ответов главная всё ещё писала 0 из 135 —
       это читалось как «прогресс не сохранился». */
    const touchedPct = Math.round(s.touched / s.total * 100);

    $screen.innerHTML =
      storageWarning() +
      '<div class="card">' +
        '<div class="row"><div><div class="menu__title">Прогресс</div>' +
        '<div class="small muted">Освоен вопрос после двух верных ответов подряд</div></div>' +
        '<div class="stat__v">' + pct + '%</div></div>' +
        '<div class="bar mt8" style="position:relative">' +
          '<div class="bar__fill" style="width:' + touchedPct + '%;opacity:.35"></div>' +
          '<div class="bar__fill' + (pct === 100 ? ' bar__fill--ok' : '') +
          '" style="width:' + pct + '%;position:absolute;top:0;left:0"></div>' +
        '</div>' +
        '<div class="row mt8 tiny muted">' +
          '<span>Отвечено: <b style="color:var(--text)">' + s.touched + '</b> из ' + s.total + '</span>' +
          '<span>Освоено: <b style="color:var(--text)">' + s.learned + '</b></span>' +
          '<span>На исправлении: <b style="color:var(--text)">' + s.weak + '</b></span>' +
        '</div>' +
      '</div>' +

      '<div class="menu">' +
        item('🎯', 'Экзамен', EXAM_SIZE + ' вопросов, допускается не более ' + EXAM_MAX_ERRORS + ' ошибки', 'exam') +
        item('📚', 'Тренировка', 'По темам, с разбором каждого ответа', 'train') +
        item('🔁', 'Работа над ошибками', weak ? weak + ' ' + plural(weak, 'вопрос', 'вопроса', 'вопросов') + ' требует повторения' : 'Ошибок нет', 'errors') +
      '</div>' +

      (last ?
        '<div class="section-title">Последняя попытка</div>' +
        '<div class="card card--tight"><div class="row">' +
          '<div><div class="small">' + fmtDate(last.ts) + '</div>' +
          '<div class="tiny muted">' + last.correct + ' из ' + last.total +
          (last.dur ? ' · ' + fmtTime(last.dur) : '') + '</div></div>' +
          '<span class="pill ' + (last.passed ? 'pill--ok' : 'pill--bad') + '">' +
          (last.passed ? 'Сдан' : 'Не сдан') + '</span>' +
        '</div></div>' : '') +

      '<div class="section-title">Ещё</div>' +
      '<div class="menu">' +
        item('⚙️', 'Настройки', 'Тема, таймер, перемешивание, данные', 'settings') +
      '</div>' +

      '<p class="tiny muted center mt24">Банк вопросов ред. ' + BANK_VERSION + ' · ' + QUESTIONS.length + ' вопросов<br>' +
      'Работает без интернета. Неофициальный тренажёр.</p>';

    function item(ic, t, sub, act) {
      return '<button class="menu__item" type="button" data-act="' + act + '">' +
        '<span class="menu__icon">' + ic + '</span>' +
        '<span class="menu__body"><span class="menu__title">' + t + '</span>' +
        '<span class="menu__sub">' + esc(sub) + '</span></span>' +
        '<span class="menu__chev">›</span></button>';
    }
  }

  /* --------------------------- Настройка тренировки ---------------------- */

  let trainCfg = { themes: { 1: true, 2: true }, onlyNew: false, count: 20 };

  function screenTrainSetup() {
    $title.textContent = 'Тренировка';
    const counts = { 1: 0, 2: 0 };
    QUESTIONS.forEach(function (q) { counts[q.theme]++; });

    $screen.innerHTML =
      '<div class="section-title">Темы</div>' +
      '<div class="card" style="padding:0">' +
        theme(1, counts[1]) + theme(2, counts[2]) +
      '</div>' +

      '<div class="section-title">Объём</div>' +
      '<div class="seg" id="seg-count">' +
        [10, 20, 40, 0].map(function (n) {
          return '<button class="seg__btn" type="button" data-n="' + n + '" aria-pressed="' +
            (trainCfg.count === n) + '">' + (n === 0 ? 'Все' : n) + '</button>';
        }).join('') +
      '</div>' +

      '<div class="card mt16" style="padding:0">' +
        '<label class="check"><input type="checkbox" id="only-new"' + (trainCfg.onlyNew ? ' checked' : '') + '>' +
        '<span class="check__body"><span class="menu__title" style="font-size:15px">Приоритет неотработанным</span>' +
        '<span class="menu__sub">Сначала вопросы с ошибками и те, что ещё не встречались</span></span></label>' +
      '</div>' +

      '<div class="mt24"><button class="btn" type="button" data-act="start-train">Начать</button></div>';

    function theme(id, n) {
      return '<label class="check"><input type="checkbox" data-theme="' + id + '"' +
        (trainCfg.themes[id] ? ' checked' : '') + '>' +
        '<span class="check__body"><span class="menu__title" style="font-size:15px">' + THEMES[id] + '</span>' +
        '<span class="menu__sub">' + n + ' ' + plural(n, 'вопрос', 'вопроса', 'вопросов') + '</span></span></label>';
    }
  }

  function startTrain() {
    const themes = Object.keys(trainCfg.themes).filter(function (k) { return trainCfg.themes[k]; }).map(Number);
    if (!themes.length) { toast('Выберите хотя бы одну тему'); return; }
    let list = QUESTIONS.filter(function (q) { return themes.indexOf(q.theme) !== -1; });

    if (trainCfg.onlyNew) {
      /* Вес: слабые (были ошибки) → новые → освоенные. Внутри группы случайно. */
      const rank = function (q) {
        const p = Store.stat(q.id);
        if (p.w > 0 && p.st < 2) return 0;
        if (p.s === 0) return 1;
        return 2;
      };
      list = shuffle(list).sort(function (a, b) { return rank(a) - rank(b); });
    } else {
      list = shuffle(list);
    }
    if (trainCfg.count > 0) list = list.slice(0, trainCfg.count);

    session = new Session('train', list, { instant: Store.settings().instantFeedback });
    go('/run');
  }

  function startExam() {
    const scope = Store.settings().examScope === 'renewal' ? 'renewal' : 'initial';
    const src = pool(scope);
    const list = shuffle(src).slice(0, EXAM_SIZE);
    const st = Store.settings();
    session = new Session('exam', list, {
      instant: false,
      limitSec: st.timerEnabled ? st.timerSec : 0
    });
    go('/run');
  }

  function startErrors() {
    const ids = Store.weakIds(QUESTIONS);
    if (!ids.length) { toast('Ошибок нет — повторять нечего'); return; }
    const list = shuffle(QUESTIONS.filter(function (q) { return ids.indexOf(q.id) !== -1; }));
    session = new Session('errors', list, { instant: true });
    go('/run');
  }

  /* ------------------------------ Прохождение ---------------------------- */

  function screenRun() {
    if (!session) { go('/'); return; }
    if (session.finished()) { go('/result'); return; }

    const q = session.current();
    const map = session.order[session.idx];
    const n = session.items.length;
    const num = session.idx + 1;
    const pct = Math.round(num / n * 100);

    $title.textContent = session.mode === 'exam' ? 'Экзамен'
                       : session.mode === 'errors' ? 'Работа над ошибками' : 'Тренировка';

    if (session.mode === 'exam' && session.limitSec) {
      $slot.innerHTML = '<span class="timer" id="timer">' + fmtTime(session.limitSec) + '</span>';
      startTimer();
    }

    $screen.innerHTML =
      '<div class="quiz">' +
        '<div class="quiz__meta">' +
          '<span>Вопрос ' + num + ' из ' + n + '</span>' +
          '<span>' + esc(THEMES[q.theme]) + '</span>' +
        '</div>' +
        '<div class="bar quiz__progress"><div class="bar__fill" style="width:' + pct + '%"></div></div>' +
        '<p class="quiz__q">' + esc(q.q) + '</p>' +
        '<div class="opts" id="opts">' +
          map.map(function (realIdx, pos) {
            return '<button class="opt" type="button" data-pos="' + pos + '">' +
              '<span class="opt__n">' + (pos + 1) + '</span>' +
              '<span class="opt__t">' + esc(q.options[realIdx]) + '</span></button>';
          }).join('') +
        '</div>' +
        '<div id="verdict"></div>' +
        '<div class="quiz__foot" id="foot">' +
          '<button class="btn btn--ghost" type="button" data-act="abort">Прервать</button>' +
        '</div>' +
      '</div>';
  }

  function onAnswer(pos) {
    if (!session || session.locked) return;
    const q = session.current();
    const map = session.order[session.idx];
    const ok = session.answer(pos);
    const correctPos = map.indexOf(q.correct - 1);

    const opts = $screen.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function (el) { el.disabled = true; });

    if (session.instant) {
      opts[correctPos].dataset.state = 'right';
      if (!ok) opts[pos].dataset.state = 'wrong';
    } else {
      opts[pos].dataset.state = 'picked';
    }

    buzz(ok ? 12 : [18, 60, 18]);

    const $v = document.getElementById('verdict');
    if (session.instant) {
      $v.innerHTML = '<div class="verdict ' + (ok ? 'verdict--ok' : 'verdict--bad') + '">' +
        (ok ? '✓ Верно' : '✕ Неверно. Правильный ответ — ' + (correctPos + 1)) + '</div>';
    }

    const lastQ = session.idx === session.items.length - 1;
    const $foot = document.getElementById('foot');
    $foot.className = 'quiz__foot quiz__foot--pinned';
    $foot.innerHTML =
      '<button class="btn" type="button" data-act="next">' +
      (lastQ ? 'Завершить' : 'Далее') + '</button>' +
      '<button class="btn btn--ghost" type="button" data-act="abort">Прервать</button>';

    /* Показываем разбор, не заставляя пользователя искать его прокруткой. */
    if (session.instant) {
      const v = $v.firstElementChild;
      if (v && v.scrollIntoView) v.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function nextQuestion() {
    session.next();
    if (session.finished()) { finishSession(); return; }
    render();
  }

  function finishSession() {
    stopTimer();
    if (session.mode === 'exam') {
      const dur = Math.round((Date.now() - session.startedAt) / 1000);
      const correct = session.answers.filter(function (a) { return a.ok; }).length;
      const answered = session.answers.length;
      const wrong = session.items.length - correct;   // неотвеченные = ошибки
      Store.addExam({
        ts: Date.now(), total: session.items.length, correct: correct,
        answered: answered, dur: dur, passed: wrong <= EXAM_MAX_ERRORS
      });
    }
    go('/result');
  }

  function abortSession() {
    if (!confirm('Прервать? Ответы на текущие вопросы уже учтены в статистике.')) return;
    stopTimer();
    session = null;
    go('/');
  }

  /* ------------------------------- Таймер -------------------------------- */

  function startTimer() {
    stopTimer();
    timerId = setInterval(function () {
      const left = Math.round((session.deadline - Date.now()) / 1000);
      const el = document.getElementById('timer');
      if (el) {
        el.textContent = fmtTime(left);
        el.classList.toggle('timer--alarm', left <= 60);
      }
      if (left <= 0) {
        stopTimer();
        toast('Время вышло');
        buzz([30, 80, 30, 80, 30]);
        finishSession();
      }
    }, 1000);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* ------------------------------ Результат ------------------------------ */

  function screenResult() {
    if (!session) { go('/'); return; }
    const total = session.items.length;
    const correct = session.answers.filter(function (a) { return a.ok; }).length;
    const wrong = total - correct;
    const isExam = session.mode === 'exam';
    const passed = wrong <= EXAM_MAX_ERRORS;
    const dur = Math.round((Date.now() - session.startedAt) / 1000);

    $title.textContent = 'Результат';
    $back.hidden = true;

    const okState = isExam ? passed : (wrong === 0);

    let html =
      '<div class="result-hero">' +
        '<div class="result-hero__mark result-hero__mark--' + (okState ? 'ok' : 'bad') + '">' +
          (okState ? '✓' : '✕') + '</div>' +
        '<h2 class="result-hero__title">' +
          (isExam ? (passed ? 'Экзамен сдан' : 'Экзамен не сдан') : correct + ' из ' + total) +
        '</h2>' +
        '<p class="result-hero__sub">' +
          correct + ' из ' + total + ' верно · ' + fmtTime(dur) +
          (isExam ? '<br>Порог: не более ' + EXAM_MAX_ERRORS + ' ошибки' : '') +
        '</p>' +
      '</div>';

    const misses = session.answers.filter(function (a) { return !a.ok; });
    if (misses.length) {
      html += '<div class="section-title">Разбор ошибок</div><div class="card review">';
      misses.forEach(function (a) {
        const q = QUESTIONS.filter(function (x) { return x.id === a.id; })[0];
        html += '<div class="review__item">' +
          '<div class="review__q">' + esc(q.q) + '</div>' +
          '<div class="review__a review__a--bad">Ваш ответ: ' + esc(q.options[a.picked]) + '</div>' +
          '<div class="review__a review__a--ok">Верно: ' + esc(q.options[a.correct]) + '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    if (session.answers.length < total) {
      html += '<p class="small muted center">Без ответа осталось ' +
        (total - session.answers.length) + ' — засчитаны как ошибки.</p>';
    }

    html += '<div class="mt24">' +
      '<button class="btn" type="button" data-act="' + (isExam ? 'exam' : 'again') + '">' +
        (isExam ? 'Пройти ещё раз' : 'Повторить набор') + '</button>' +
      (misses.length ? '<button class="btn btn--secondary" type="button" data-act="errors">Отработать ошибки</button>' : '') +
      '<button class="btn btn--ghost" type="button" data-act="home">На главную</button>' +
      '</div>';

    $screen.innerHTML = html;
  }

  /* ------------------------------- Билеты -------------------------------- */

  let studyTheme = 1, studyIdx = 0;

  function screenStudy() {
    $title.textContent = 'Билеты';
    const list = QUESTIONS.filter(function (q) { return q.theme === studyTheme; });
    if (studyIdx >= list.length) studyIdx = 0;
    const q = list[studyIdx];
    const p = Store.stat(q.id);

    $screen.innerHTML =
      '<div class="seg" id="seg-theme">' +
        [1, 2].map(function (t) {
          return '<button class="seg__btn" type="button" data-theme="' + t + '" aria-pressed="' +
            (studyTheme === t) + '">' + THEMES[t].split(' ')[0] + '</button>';
        }).join('') +
      '</div>' +

      '<div class="quiz__meta mt16">' +
        '<span>№ ' + q.id + ' · ' + (studyIdx + 1) + ' из ' + list.length + '</span>' +
        '<span>' + (p.s ? (Store.isLearned(q.id) ? '<span class="pill pill--ok">освоен</span>' :
                          (p.w ? '<span class="pill pill--bad">с ошибками</span>' : '<span class="pill">в работе</span>')) : '') + '</span>' +
      '</div>' +

      '<div class="card"><p class="quiz__q" style="margin-bottom:12px">' + esc(q.q) + '</p>' +
      '<div class="opts">' +
        q.options.map(function (o, i) {
          const right = (i + 1) === q.correct;
          return '<div class="opt"' + (right ? ' data-state="right"' : '') + '>' +
            '<span class="opt__n">' + (i + 1) + '</span>' +
            '<span class="opt__t">' + esc(o) + '</span></div>';
        }).join('') +
      '</div></div>' +

      '<div class="row mt16">' +
        '<button class="btn btn--secondary" type="button" data-act="study-prev" style="flex:1' +
          (studyIdx === 0 ? ';opacity:.45' : '') + '"' + (studyIdx === 0 ? ' disabled' : '') + '>← Назад</button>' +
        '<button class="btn btn--secondary" type="button" data-act="study-next" style="flex:1"' +
          (studyIdx === list.length - 1 ? ' disabled' : '') + '>Вперёд →</button>' +
      '</div>' +
      '<div class="mt8"><button class="btn btn--ghost" type="button" data-act="study-jump">Перейти к номеру…</button></div>';
  }

  /* ------------------------------- Ошибки -------------------------------- */

  function screenErrors() {
    $title.textContent = 'Работа над ошибками';
    const weak = QUESTIONS.filter(function (q) { return Store.isWeak(q.id); });

    if (!weak.length) {
      $screen.innerHTML =
        '<div class="empty"><div class="empty__icon">🎉</div>' +
        '<p>Вопросов с ошибками нет.<br>Пройдите экзамен или тренировку — сюда попадут те, где вы ошиблись.</p></div>' +
        '<button class="btn btn--secondary" type="button" data-act="train">К тренировке</button>';
      return;
    }

    $screen.innerHTML =
      '<div class="card"><div class="row">' +
        '<div><div class="menu__title">' + weak.length + ' ' + plural(weak.length, 'вопрос', 'вопроса', 'вопросов') + '</div>' +
        '<div class="small muted">Уходят из списка после двух верных ответов подряд</div></div>' +
      '</div></div>' +
      '<button class="btn" type="button" data-act="errors">Отработать</button>' +
      '<div class="section-title">Список</div><div class="card review">' +
        weak.map(function (q) {
          const p = Store.stat(q.id);
          return '<div class="review__item">' +
            '<div class="review__q">' + esc(q.q) + '</div>' +
            '<div class="tiny muted">№ ' + q.id + ' · ' + THEMES[q.theme] +
            ' · ошибок: ' + p.w + ', верно подряд: ' + p.st + '</div></div>';
        }).join('') +
      '</div>';
  }

  /* ----------------------------- Статистика ------------------------------ */

  function screenStats() {
    $title.textContent = 'Статистика';
    const s = Store.summary(QUESTIONS);
    const ex = Store.exams();
    const passed = ex.filter(function (e) { return e.passed; }).length;

    const byTheme = [1, 2].map(function (t) {
      const list = QUESTIONS.filter(function (q) { return q.theme === t; });
      const done = list.filter(function (q) { return Store.isLearned(q.id); }).length;
      const pct = Math.round(done / list.length * 100);
      return '<div class="card card--tight">' +
        '<div class="row"><span class="small">' + THEMES[t] + '</span>' +
        '<span class="small muted">' + done + '/' + list.length + '</span></div>' +
        '<div class="bar mt8"><div class="bar__fill' + (pct === 100 ? ' bar__fill--ok' : '') +
        '" style="width:' + pct + '%"></div></div></div>';
    }).join('');

    $screen.innerHTML =
      '<div class="stat-grid">' +
        stat(s.learned + '/' + s.total, 'Освоено') +
        stat(s.accuracy + '%', 'Точность ответов') +
        stat(s.weak, 'На исправлении') +
        stat(ex.length ? passed + '/' + ex.length : '—', 'Экзамены сданы') +
      '</div>' +

      '<div class="section-title">По темам</div>' + byTheme +

      '<div class="section-title">История экзаменов</div>' +
      (ex.length ?
        '<div class="card hist">' + ex.slice(0, 20).map(function (e) {
          return '<div class="hist__row"><span>' + fmtDate(e.ts) + '</span>' +
            '<span class="muted">' + e.correct + '/' + e.total +
            (e.dur ? ' · ' + fmtTime(e.dur) : '') + '</span>' +
            '<span class="pill ' + (e.passed ? 'pill--ok' : 'pill--bad') + '">' +
            (e.passed ? 'сдан' : 'не сдан') + '</span></div>';
        }).join('') + '</div>'
        : '<div class="empty"><div class="empty__icon">📊</div><p>Попыток пока нет</p></div>');

    function stat(v, l) {
      return '<div class="stat"><div class="stat__v">' + v + '</div><div class="stat__l">' + l + '</div></div>';
    }
  }

  /* ----------------------------- Настройки -------------------------------- */

  function screenSettings() {
    $title.textContent = 'Настройки';
    const st = Store.settings();

    $screen.innerHTML =
      '<div class="section-title">Экзамен</div>' +
      '<div class="card" style="padding:0">' +
        toggle('timerEnabled', 'Таймер', 'Ограничение времени на ' + EXAM_SIZE + ' вопросов', st.timerEnabled) +
        '<div class="check"><span class="check__body"><span class="menu__title" style="font-size:15px">Лимит времени</span>' +
        '<span class="menu__sub">Официальный норматив в открытых источниках не подтверждён; значение по умолчанию — 10 мин</span></span>' +
        '<select id="sel-timer" style="background:var(--bg-elev-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px">' +
          [300, 600, 900, 1200].map(function (v) {
            return '<option value="' + v + '"' + (st.timerSec === v ? ' selected' : '') + '>' + (v / 60) + ' мин</option>';
          }).join('') +
        '</select></div>' +
        '<div class="check"><span class="check__body"><span class="menu__title" style="font-size:15px">Тип проверки</span>' +
        '<span class="menu__sub">При продлении часть вопросов не используется</span></span>' +
        '<select id="sel-scope" style="background:var(--bg-elev-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px">' +
          '<option value="initial"' + (st.examScope !== 'renewal' ? ' selected' : '') + '>Первичная</option>' +
          '<option value="renewal"' + (st.examScope === 'renewal' ? ' selected' : '') + '>Продление</option>' +
        '</select></div>' +
      '</div>' +

      '<div class="section-title">Вопросы</div>' +
      '<div class="card" style="padding:0">' +
        toggle('shuffleOptions', 'Перемешивать варианты', 'Чтобы не запоминать позицию ответа', st.shuffleOptions) +
        toggle('instantFeedback', 'Разбор сразу', 'В тренировке показывать верный ответ после выбора', st.instantFeedback) +
        toggle('haptics', 'Вибро-отклик', 'На iPhone в Safari не поддерживается', st.haptics) +
      '</div>' +

      '<div class="section-title">Оформление</div>' +
      '<div class="seg" id="seg-theme-ui">' +
        [['auto', 'Как в системе'], ['dark', 'Тёмная'], ['light', 'Светлая']].map(function (p) {
          return '<button class="seg__btn" type="button" data-t="' + p[0] + '" aria-pressed="' +
            (st.theme === p[0]) + '">' + p[1] + '</button>';
        }).join('') +
      '</div>' +

      '<div class="section-title">Данные</div>' +
      '<button class="btn btn--secondary" type="button" data-act="export">Выгрузить прогресс в файл</button>' +
      '<button class="btn btn--secondary" type="button" data-act="import">Загрузить из файла</button>' +
      '<button class="btn btn--danger" type="button" data-act="reset">Сбросить весь прогресс</button>' +
      '<input type="file" id="file-import" accept="application/json,.json" hidden>' +

      '<p class="tiny muted mt24">Версия банка: ' + BANK_VERSION + ' · вопросов: ' + QUESTIONS.length + '<br>' +
      'Источник вопросов: сайт стрелкового клуба «ГРИДИНЪ» (раздел тестирования).<br>' +
      'Приложение неофициальное и не заменяет подготовку в лицензированной организации.</p>';

    function toggle(key, title, sub, on) {
      return '<label class="check"><span class="check__body">' +
        '<span class="menu__title" style="font-size:15px">' + title + '</span>' +
        '<span class="menu__sub">' + sub + '</span></span>' +
        '<span class="switch"><input type="checkbox" data-set="' + key + '"' + (on ? ' checked' : '') + '>' +
        '<span class="switch__track"></span></span></label>';
    }
  }

  function applyTheme() {
    document.documentElement.dataset.theme = Store.settings().theme || 'auto';
  }

  /* ------------------------ экспорт / импорт данных ----------------------- */

  function exportProgress() {
    const blob = new Blob([Store.exportJSON()], { type: 'application/json' });
    const name = 'boo2026-progress-' + new Date().toISOString().slice(0, 10) + '.json';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('Файл сформирован');
  }

  function importProgress(file) {
    const fr = new FileReader();
    fr.onload = function () {
      try {
        Store.importJSON(String(fr.result));
        applyTheme();
        toast('Прогресс загружен');
        render();
      } catch (e) {
        toast('Не удалось прочитать файл');
      }
    };
    fr.readAsText(file);
  }

  /* ------------------------------ события -------------------------------- */

  $screen.addEventListener('click', function (e) {
    const opt = e.target.closest('.opt[data-pos]');
    if (opt && !opt.disabled) { onAnswer(Number(opt.dataset.pos)); return; }

    const seg = e.target.closest('.seg__btn');
    if (seg) {
      if (seg.dataset.n !== undefined) { trainCfg.count = Number(seg.dataset.n); render(); return; }
      if (seg.dataset.theme !== undefined) { studyTheme = Number(seg.dataset.theme); studyIdx = 0; render(); return; }
      if (seg.dataset.t !== undefined) { Store.set('theme', seg.dataset.t); applyTheme(); render(); return; }
    }

    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;

    switch (act) {
      case 'exam':        startExam(); break;
      case 'train':       go('/train'); break;
      case 'start-train': startTrain(); break;
      case 'errors':      startErrors(); break;
      case 'settings':    go('/settings'); break;
      case 'next':        nextQuestion(); break;
      case 'abort':       abortSession(); break;
      case 'home':        session = null; go('/'); break;
      case 'again': {
        const items = session.items;
        session = new Session(session.mode, shuffle(items), { instant: session.instant });
        go('/run'); break;
      }
      case 'study-prev':  studyIdx--; render(); break;
      case 'study-next':  studyIdx++; render(); break;
      case 'study-jump': {
        const list = QUESTIONS.filter(function (q) { return q.theme === studyTheme; });
        const v = prompt('Номер вопроса (1–' + list.length + '):');
        const n = parseInt(v, 10);
        if (n >= 1 && n <= list.length) { studyIdx = n - 1; render(); }
        break;
      }
      case 'export':      exportProgress(); break;
      case 'import':      document.getElementById('file-import').click(); break;
      case 'reset':
        if (confirm('Удалить весь прогресс и историю экзаменов? Действие необратимо.')) {
          Store.resetProgress(); toast('Прогресс сброшен'); render();
        }
        break;
    }
  });

  $screen.addEventListener('change', function (e) {
    const t = e.target;
    if (t.dataset.theme !== undefined && t.type === 'checkbox') {
      trainCfg.themes[t.dataset.theme] = t.checked; return;
    }
    if (t.id === 'only-new') { trainCfg.onlyNew = t.checked; return; }
    if (t.dataset.set) { Store.set(t.dataset.set, t.checked); return; }
    if (t.id === 'sel-timer') { Store.set('timerSec', Number(t.value)); return; }
    if (t.id === 'sel-scope') { Store.set('examScope', t.value); return; }
    if (t.id === 'file-import' && t.files && t.files[0]) { importProgress(t.files[0]); return; }
  });

  $back.addEventListener('click', function () {
    if (session && !session.finished() && parseHash().path === '/run') { abortSession(); return; }
    history.back();
  });

  window.addEventListener('hashchange', render);

  /* Пересчёт оставшегося времени после возврата из фона: setInterval в iOS
     приостанавливается, но дедлайн хранится абсолютным временем. */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (session && session.mode === 'exam' && session.deadline) {
      if (Date.now() >= session.deadline) { stopTimer(); finishSession(); }
    }
  });

  /* Двойной тап-зум гасится через CSS touch-action: manipulation — это надёжнее
     JS-перехвата touchend, который ломает быстрые последовательные нажатия. */

  /* --------------------------- Service Worker ----------------------------- */

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    /* Регистрация возможна только в защищённом контексте. Проверяем именно
       isSecureContext, а не протокол: он корректно покрывает https, localhost
       и 127.0.0.1 и отсекает file:// — при открытии файла с диска приложение
       просто работает без кэша SW, а не падает. */
    if (!window.isSecureContext) return;
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', function () {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            toast('Доступно обновление — перезапустите приложение');
          }
        });
      });
    }).catch(function (e) { console.warn('[sw] не зарегистрирован', e); });
  }

  /* ------------------------------- старт ---------------------------------- */

  applyTheme();
  if (!location.hash) location.hash = '#/';
  render();
  document.getElementById('app').hidden = false;
  document.getElementById('boot').hidden = true;
  registerSW();
})();

</script>
</body>
</html>
